<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Snake for iPhone</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230f172a'/%3E%3Cpath d='M16 34c0-8 6-14 14-14h4c8 0 14 6 14 14s-6 14-14 14H22' fill='none' stroke='%2386efac' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='34' r='3' fill='%23fb7185'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <main class="phone-frame">
        <section class="hero-card glass-card">
          <div>
            <p class="eyebrow">Arcade Classic</p>
            <h1>Snake</h1>
          </div>
          <button class="control-pill" id="pauseButton" type="button">Pause</button>
        </section>

        <section class="stats-grid">
          <article class="stat-card glass-card">
            <span class="stat-label">Score</span>
            <strong class="stat-value" id="scoreValue">0</strong>
          </article>
          <article class="stat-card glass-card">
            <span class="stat-label">Best</span>
            <strong class="stat-value" id="bestValue">0</strong>
          </article>
          <article class="stat-card glass-card">
            <span class="stat-label">Speed</span>
            <strong class="stat-value" id="speedValue">1x</strong>
          </article>
        </section>

        <section class="board-card glass-card">
          <div class="board-header">
            <p class="board-title">Swipe or tap to move</p>
            <button class="control-pill secondary" id="restartButton" type="button">Restart</button>
          </div>

          <div class="canvas-wrap">
            <canvas id="gameCanvas" width="360" height="360" aria-label="Snake game field"></canvas>
            <div class="overlay visible" id="overlay">
              <p class="overlay-kicker" id="overlayKicker">Ready?</p>
              <h2 id="overlayTitle">Tap Start</h2>
              <p id="overlayText">Collect glowing fruit, avoid walls and your tail.</p>
              <button class="primary-button" id="startButton" type="button">Start Game</button>
            </div>
          </div>
        </section>

        <section class="controls-card glass-card">
          <div class="controls-header">
            <p>Touch Controls</p>
            <span>Designed for iPhone screens</span>
          </div>

          <div class="dpad" aria-label="Directional pad">
            <button class="dpad-button up" data-direction="up" type="button" aria-label="Move up">
              ↑
            </button>
            <button class="dpad-button left" data-direction="left" type="button" aria-label="Move left">
              ←
            </button>
            <button class="dpad-button center" id="speedButton" type="button" aria-label="Boost speed">
              Boost
            </button>
            <button class="dpad-button right" data-direction="right" type="button" aria-label="Move right">
              →
            </button>
            <button class="dpad-button down" data-direction="down" type="button" aria-label="Move down">
              ↓
            </button>
          </div>
        </section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
